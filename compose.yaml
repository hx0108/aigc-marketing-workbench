name: aigc-marketing
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aigc
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigc -d aigc"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
